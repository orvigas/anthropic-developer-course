<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards · Anthropic Certification</title>
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/tarjetas.css">
</head>
<body>
<div class="contenedor">
    <header>
        <h1>🧠 Interactive Study Flashcards</h1>
        <p>Claude Developer Certification · Anthropic</p>
        <div class="estadisticas" id="global-stats"></div>
    </header>

    <div class="navegacion" id="tab-nav"></div>

    <main class="vista">
        <div class="aviso">
            💡 <strong>Click the card</strong> (or press the space bar) to flip it. Mark <em>I know it</em> / <em>Review</em>
            to keep track; use ← → to move between cards.
        </div>
        <div class="filtros" id="fc-filtros"></div>
        <div class="contador"><span id="current-card">1</span> / <span id="total-cards">0</span> · <span id="fc-marca"></span></div>
        <div class="progreso"><div class="progreso__relleno" id="progress-fill"></div></div>

        <div class="escena">
            <div class="tarjeta" id="flip-card">
                <div class="tarjeta__cara tarjeta__cara--anverso">
                    <div class="insignia" id="fc-modulo">M1</div>
                    <div class="tarjeta__pregunta" id="fc-pregunta"></div>
                    <div class="tarjeta__pista">Click to see the answer</div>
                </div>
                <div class="tarjeta__cara tarjeta__cara--reverso">
                    <div class="insignia" id="fc-modulo-b">M1</div>
                    <div class="tarjeta__respuesta" id="fc-respuesta"></div>
                    <div class="tarjeta__pista">Click to go back</div>
                </div>
            </div>
        </div>

        <div class="tarjeta__botones">
            <button class="tarjeta__boton" id="prev-btn">← Previous</button>
            <button class="tarjeta__boton tarjeta__boton--acierto" id="know-btn">✓ I know it</button>
            <button class="tarjeta__boton tarjeta__boton--repasar" id="review-btn">↻ Review</button>
            <button class="tarjeta__boton" id="shuffle-btn">🔀 Shuffle</button>
            <button class="tarjeta__boton" id="next-btn">Next →</button>
        </div>
    </main>
</div>

<script src="../../assets/js/i18n/en.js"></script>
<script src="../../assets/js/datos/en/modulos.js"></script>
<script src="../../assets/js/datos/en/totales.js"></script>
<script src="../../assets/js/almacen.js"></script>
<script src="../../assets/js/comun.js"></script>
<script src="../../assets/js/datos/en/flashcards.js"></script>
<script src="../../assets/js/tarjetas.js"></script>
</body>
</html>
