<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock exam · Anthropic Certification</title>
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/quiz.css">
    <link rel="stylesheet" href="../../assets/css/codigo.css">
    <link rel="stylesheet" href="../../assets/css/resultados.css">
</head>
<body>
<div class="contenedor">
    <header>
        <h1>🧠 Interactive Study Flashcards</h1>
        <p>Claude Developer Certification · Anthropic</p>
        <div class="estadisticas" id="global-stats"></div>
    </header>

    <div class="navegacion" id="tab-nav"></div>

    <main class="vista">
        <div id="exam-intro" class="panel resumen">
            <h2>🎓 Mock exam</h2>
            <p style="color:var(--texto-suave); margin-bottom:18px;">
                25 random questions from the five modules (multiple choice, true/false and code),
                on a 20-minute clock. When you finish you get the per-module breakdown.
            </p>
            <div class="desglose" id="exam-record"></div>
            <button class="boton-accion" id="exam-start" style="margin-top:18px;">▶️ Start mock exam</button>
        </div>

        <div id="exam-run" style="display:none;">
            <div style="text-align:center; margin-bottom:16px;">
                <span class="cronometro" id="exam-timer">20:00</span>
            </div>
            <div class="contador"><span id="exam-pos">1</span> / <span id="exam-total">25</span></div>
            <div class="progreso"><div class="progreso__relleno" id="exam-progress"></div></div>
            <div class="panel" id="exam-panel"></div>
            <div class="tarjeta__botones">
                <button class="tarjeta__boton" id="exam-prev">← Previous</button>
                <button class="tarjeta__boton" id="exam-next">Next →</button>
                <button class="tarjeta__boton tarjeta__boton--acierto" id="exam-finish">✓ Finish and grade</button>
            </div>
        </div>

        <div id="exam-results" style="display:none;"></div>
    </main>
</div>

<script src="../../assets/js/i18n/en.js"></script>
<script src="../../assets/js/datos/en/modulos.js"></script>
<script src="../../assets/js/datos/en/totales.js"></script>
<script src="../../assets/js/almacen.js"></script>
<script src="../../assets/js/comun.js"></script>
<script src="../../assets/js/datos/en/quizzes.js"></script>
<script src="../../assets/js/datos/en/verdadero-falso.js"></script>
<script src="../../assets/js/datos/en/codigo.js"></script>
<script src="../../assets/js/simulacro.js"></script>
</body>
</html>
