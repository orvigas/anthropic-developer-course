<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas · Certificación Anthropic</title>
    <script>
    /* El enlace simbólico ./index.html se abre desde la raíz del repositorio,
       donde las rutas relativas resolverían un nivel por encima de ./html/.
       Cuando el documento no está ya dentro de /html/, se ancla ahí. */
    (function () {
        var dir = location.pathname.replace(/[^/]*$/, '');
        if (!/\/html\/$/.test(dir)) {
            var b = document.createElement('base');
            b.href = 'html/';
            document.head.appendChild(b);
        }
    }());
    </script>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/tarjetas.css">
</head>
<body>
<div class="container">
    <header>
        <h1>🧠 Tarjetas de Estudio Interactivas</h1>
        <p>Certificación de Desarrollador Claude · Anthropic</p>
        <div class="global-stats" id="global-stats"></div>
    </header>

    <div class="tab-navigation" id="tab-nav"></div>

    <main class="vista">
        <div class="tip">
            💡 <strong>Clic en la tarjeta</strong> (o barra espaciadora) para voltearla. Marca <em>La sé</em> / <em>Repasar</em>
            para llevar registro; usa ← → para navegar.
        </div>
        <div class="filtros" id="fc-filtros"></div>
        <div class="card-counter"><span id="current-card">1</span> / <span id="total-cards">0</span> · <span id="fc-marca"></span></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

        <div class="flip-scene">
            <div class="flip-card" id="flip-card">
                <div class="flip-face front">
                    <div class="module-badge" id="fc-modulo">M1</div>
                    <div class="flip-question" id="fc-pregunta"></div>
                    <div class="flip-hint">Clic para ver la respuesta</div>
                </div>
                <div class="flip-face back">
                    <div class="module-badge" id="fc-modulo-b">M1</div>
                    <div class="flip-answer" id="fc-respuesta"></div>
                    <div class="flip-hint">Clic para volver</div>
                </div>
            </div>
        </div>

        <div class="navigation-buttons">
            <button class="nav-btn" id="prev-btn">← Anterior</button>
            <button class="nav-btn ok" id="know-btn">✓ La sé</button>
            <button class="nav-btn review" id="review-btn">↻ Repasar</button>
            <button class="nav-btn" id="shuffle-btn">🔀 Mezclar</button>
            <button class="nav-btn" id="next-btn">Siguiente →</button>
        </div>
    </main>
</div>

<script src="../assets/js/datos/modulos.js"></script>
<script src="../assets/js/datos/totales.js"></script>
<script src="../assets/js/almacen.js"></script>
<script src="../assets/js/comun.js"></script>
<script src="../assets/js/datos/flashcards.js"></script>
<script src="../assets/js/tarjetas.js"></script>
</body>
</html>
