<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulacro de examen · Certificación Anthropic</title>
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/quiz.css">
    <link rel="stylesheet" href="../../assets/css/codigo.css">
    <link rel="stylesheet" href="../../assets/css/resultados.css">
</head>
<body>
<div class="contenedor">
    <header>
        <h1>🧠 Tarjetas de Estudio Interactivas</h1>
        <p>Certificación de Desarrollador Claude · Anthropic</p>
        <div class="estadisticas" id="global-stats"></div>
    </header>

    <div class="navegacion" id="tab-nav"></div>

    <main class="vista">
        <div id="exam-intro" class="panel resumen">
            <h2>🎓 Simulacro de examen</h2>
            <p style="color:var(--texto-suave); margin-bottom:18px;">
                25 preguntas aleatorias de los cinco módulos (opción múltiple, verdadero/falso y código),
                con 20 minutos de tiempo. Al terminar verás el desglose por módulo.
            </p>
            <div class="desglose" id="exam-record"></div>
            <button class="boton-accion" id="exam-start" style="margin-top:18px;">▶️ Comenzar simulacro</button>
        </div>

        <div id="exam-run" style="display:none;">
            <div style="text-align:center; margin-bottom:16px;">
                <span class="cronometro" id="exam-timer">20:00</span>
            </div>
            <div class="contador"><span id="exam-pos">1</span> / <span id="exam-total">25</span></div>
            <div class="progreso"><div class="progreso__relleno" id="exam-progress"></div></div>
            <div class="panel" id="exam-panel"></div>
            <div class="tarjeta__botones">
                <button class="tarjeta__boton" id="exam-prev">← Anterior</button>
                <button class="tarjeta__boton" id="exam-next">Siguiente →</button>
                <button class="tarjeta__boton tarjeta__boton--acierto" id="exam-finish">✓ Terminar y calificar</button>
            </div>
        </div>

        <div id="exam-results" style="display:none;"></div>
    </main>
</div>

<script src="../../assets/js/i18n/es.js"></script>
<script src="../../assets/js/datos/es/modulos.js"></script>
<script src="../../assets/js/datos/es/totales.js"></script>
<script src="../../assets/js/almacen.js"></script>
<script src="../../assets/js/comun.js"></script>
<script src="../../assets/js/datos/es/quizzes.js"></script>
<script src="../../assets/js/datos/es/verdadero-falso.js"></script>
<script src="../../assets/js/datos/es/codigo.js"></script>
<script src="../../assets/js/simulacro.js"></script>
</body>
</html>
