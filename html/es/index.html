<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas · Certificación Anthropic</title>
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/tarjetas.css">
</head>
<body>
<div class="contenedor">
    <header>
        <h1>🧠 Tarjetas de Estudio Interactivas</h1>
        <p>Certificación de Desarrollador Claude · Anthropic</p>
        <div class="estadisticas" id="global-stats"></div>
    </header>

    <div class="navegacion" id="tab-nav"></div>

    <main class="vista">
        <div class="aviso">
            💡 <strong>Clic en la tarjeta</strong> (o barra espaciadora) para voltearla. Marca <em>La sé</em> / <em>Repasar</em>
            para llevar registro; usa ← → para navegar.
        </div>
        <div class="filtros" id="fc-filtros"></div>
        <div class="contador"><span id="current-card">1</span> / <span id="total-cards">0</span> · <span id="fc-marca"></span></div>
        <div class="progreso"><div class="progreso__relleno" id="progress-fill"></div></div>

        <div class="escena">
            <div class="tarjeta" id="flip-card">
                <div class="tarjeta__cara tarjeta__cara--anverso">
                    <div class="insignia" id="fc-modulo">M1</div>
                    <div class="tarjeta__pregunta" id="fc-pregunta"></div>
                    <div class="tarjeta__pista">Clic para ver la respuesta</div>
                </div>
                <div class="tarjeta__cara tarjeta__cara--reverso">
                    <div class="insignia" id="fc-modulo-b">M1</div>
                    <div class="tarjeta__respuesta" id="fc-respuesta"></div>
                    <div class="tarjeta__pista">Clic para volver</div>
                </div>
            </div>
        </div>

        <div class="tarjeta__botones">
            <button class="tarjeta__boton" id="prev-btn">← Anterior</button>
            <button class="tarjeta__boton tarjeta__boton--acierto" id="know-btn">✓ La sé</button>
            <button class="tarjeta__boton tarjeta__boton--repasar" id="review-btn">↻ Repasar</button>
            <button class="tarjeta__boton" id="shuffle-btn">🔀 Mezclar</button>
            <button class="tarjeta__boton" id="next-btn">Siguiente →</button>
        </div>
    </main>
</div>

<script src="../../assets/js/i18n/es.js"></script>
<script src="../../assets/js/datos/es/modulos.js"></script>
<script src="../../assets/js/datos/es/totales.js"></script>
<script src="../../assets/js/almacen.js"></script>
<script src="../../assets/js/comun.js"></script>
<script src="../../assets/js/datos/es/flashcards.js"></script>
<script src="../../assets/js/tarjetas.js"></script>
</body>
</html>
